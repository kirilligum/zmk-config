# Set sleep timeout to 30 minutes.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Enable Urob's smart mouse layer.
CONFIG_ZMK_POINTING=y

# Urob Bluetooth tuning.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Long prompt macros are chained in chunks of at most 240 characters.
# Tap-mode macros consume two queue entries per character.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
