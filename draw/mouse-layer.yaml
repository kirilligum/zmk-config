layout:
  qmk_info_json: draw/mouse-layout.json
  layout_name: LAYOUT_right_3x5_3

layers:
  Pointer:
    - {t: PgUp, tl: J}
    - {t: PTab, tl: L}
    - {t: ↑, h: Mouse, tl: U}
    - {t: NTab, tl: Y}
    - {t: Ctrl, h: LOCK, tl: "'"}
    - {t: PgDn, tl: M}
    - {t: ←, h: Mouse, tl: N}
    - {t: ↓, h: Mouse, tl: E}
    - {t: →, h: Mouse, tl: I}
    - {t: 4×, tl: O}
    - {t: Shift, h: LOCK, tl: K}
    - {t: Copy, tl: H}
    - {t: Cut, tl: ","}
    - {t: Paste, tl: "."}
    - {t: ¼×, tl: "?"}
    - Right Click
    - Middle Click
    - Left Click

  Scroll:
    - {t: PgUp, tl: J}
    - {t: PTab, tl: L}
    - {t: ↑, h: Scroll, tl: U}
    - {t: NTab, tl: Y}
    - {t: Ctrl, h: LOCK, tl: "'"}
    - {t: PgDn, tl: M}
    - {t: ←, h: Scroll, tl: N}
    - {t: ↓, h: Scroll, tl: E}
    - {t: →, h: Scroll, tl: I}
    - {t: 4×, tl: O}
    - {t: Shift, h: LOCK, tl: K}
    - {t: Copy, tl: H}
    - {t: Cut, tl: ","}
    - {t: Paste, tl: "."}
    - {t: ¼×, tl: "?"}
    - Right Click
    - Middle Click
    - Left Click

combos:
  - {p: [0, 5], k: Hist, l: [Pointer, Scroll]}
  - {p: [5, 10], k: Snip, l: [Pointer, Scroll]}

  - {p: [1, 2], k: Close, l: [Pointer, Scroll], a: top}
  - {p: [2, 3], k: New, l: [Pointer, Scroll], a: top}
  - {p: [1, 3], k: Reopen, l: [Pointer, Scroll], a: top, o: 0.75}
  - {p: [3, 4], k: Mouse, l: [Pointer, Scroll], a: top}

  - {p: [1, 6], k: PWin, l: [Pointer, Scroll]}
  - {p: [3, 8], k: NWin, l: [Pointer, Scroll]}
  - {p: [9, 14], k: P/S, l: [Pointer, Scroll]}

  - {p: [11, 12], k: R Lock, l: [Pointer, Scroll], a: bottom}
  - {p: [11, 13], k: M Lock, l: [Pointer, Scroll], a: bottom, o: 0.35}
  - {p: [12, 13], k: L Lock, l: [Pointer, Scroll], a: bottom}
