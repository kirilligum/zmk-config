layout:
  qmk_info_json: draw/mouse-layout.json
  layout_name: LAYOUT_right_3x5_3

layers:
  Pointer:
    - {t: ⇞, tl: J}
    - {t: PTab, tl: L}
    - {t: ↑, h: 🖱, tl: U}
    - {t: NTab, tl: Y}
    - {t: ⌃🔒, tl: "'"}
    - {t: ⇟, tl: M}
    - {t: ←, h: 🖱, tl: N}
    - {t: ↓, h: 🖱, tl: E}
    - {t: →, h: 🖱, tl: I}
    - {t: 🐇, tl: O}
    - {t: ⇧🔒, tl: K}
    - {t: ⧉, tl: H}
    - {t: ✂, tl: ","}
    - {t: 📋, tl: "."}
    - {t: 🐢, tl: "?"}
    - R●
    - M●
    - L●

  Scroll:
    - {t: ⇞, tl: J}
    - {t: PTab, tl: L}
    - {t: ↑, h: ↕, tl: U}
    - {t: NTab, tl: Y}
    - {t: ⌃🔒, tl: "'"}
    - {t: ⇟, tl: M}
    - {t: ←, h: ↕, tl: N}
    - {t: ↓, h: ↕, tl: E}
    - {t: →, h: ↕, tl: I}
    - {t: 🐇, tl: O}
    - {t: ⇧🔒, tl: K}
    - {t: ⧉, tl: H}
    - {t: ✂, tl: ","}
    - {t: 📋, tl: "."}
    - {t: 🐢, tl: "?"}
    - R●
    - M●
    - L●

combos:
  - {p: [0, 5], k: 🕘, l: [Pointer, Scroll]}
  - {p: [5, 10], k: 📸, l: [Pointer, Scroll]}

  - {p: [1, 2], k: ×, l: [Pointer, Scroll], a: top}
  - {p: [2, 3], k: ＋, l: [Pointer, Scroll], a: top}
  - {p: [1, 3], k: ↶, l: [Pointer, Scroll], a: top, o: 0.75}
  - {p: [3, 4], k: 🖱, l: [Pointer, Scroll], a: top}

  - {p: [1, 6], k: PWin, l: [Pointer, Scroll]}
  - {p: [3, 8], k: NWin, l: [Pointer, Scroll]}
  - {p: [9, 14], k: 🖱↕, l: [Pointer, Scroll]}

  - {p: [11, 12], k: R🔒, l: [Pointer, Scroll], a: bottom}
  - {p: [11, 13], k: M🔒, l: [Pointer, Scroll], a: bottom, o: 0.35}
  - {p: [12, 13], k: L🔒, l: [Pointer, Scroll], a: bottom}
